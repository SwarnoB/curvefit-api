[project]
name = "curvefit-api"
version = "0.1.0"
description = "REST API for nonlinear curve fitting"
readme = "README.md"
authors = [
    { name = "Swarnendu Bhattacharyya", email = "43242202+SwarnoB@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[project.scripts]
curvefit-api = "curvefit_api:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
